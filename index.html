<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8" />
  <title>顔認証終了しました</title>
  <script src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    :root { font-size: 16px; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 16px;
    }
    h1 { margin: 0 0 12px; text-align: center; }

    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      margin: 12px auto;
      max-width: 720px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .camera-wrap { display: flex; flex-direction: column; align-items: center; }
    .video-wrapper { position: relative; display: inline-block; }
    video { border-radius: 12px; background: #000; }

    /* 緑のガイド枠（少し小さく） */
    .guide-rect{
      position:absolute;
      left:50%; top:50%;
      width:62%;
      height:68%;
      transform:translate(-50%,-50%);
      border: 2px solid rgba(0,255,0,0.85);
      border-radius: 999px;
      box-sizing:border-box;
      pointer-events:none;
    }

    #status { font-size: 0.9rem; margin-top: 10px; text-align: center; }

    .btn{
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #ccc;
      cursor: pointer;
      font-size: 1rem;
      margin: 6px 6px 6px 0;
    }
    .btn-primary{ background:#1976d2; border-color:#1976d2; color:#fff; }

    #log {
      font-size: 0.85rem;
      max-height: 240px;
      overflow-y: auto;
      background: #fafafa;
      padding: 6px 10px;
      border-radius: 10px;
    }

    /* 1週間表示 */
    .weekly-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .weekly-table th, .weekly-table td { border: 1px solid #ddd; padding: 6px 8px; text-align: center; }
    .weekly-table th { background: #f0f0f0; }
    .weekly-missing { background: #ffecec; }
    .weekly-ok { background: #f7fff7; }
    .weekly-holiday { background: #eef6ff; }

    /* ガイド オーバーレイ */
    #guideOverlay{
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      display:none;
      align-items:center;
      justify-content:center;
      z-index: 9999;
    }
    .guideBox{
      width: min(460px, 92vw);
      background:#fff;
      border-radius: 16px;
      padding: 14px;
      text-align:center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }
    .guideMessage{
      font-size: 16px;
      line-height: 1.5;
      margin: 8px 0 10px;
      white-space: pre-line;
    }
    .guideBtnRow{
      display:flex;
      gap: 10px;
      margin-top: 10px;
    }
    .guideBtn{
      flex: 1;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid #ccc;
      cursor: pointer;
      font-size: 16px;
      background: #fff;
    }
    .guideBtnPrimary{
      border-color:#1976d2;
      background:#1976d2;
      color:#fff;
    }

    .guideArrow{
      width: 0; height: 0;
      margin: 0 auto 10px;
      border-style: solid;
    }
    .arrow-none{ display:none; }
    .arrow-up{
      border-width: 0 16px 22px 16px;
      border-color: transparent transparent #1976d2 transparent;
    }
    .arrow-right{
      border-width: 16px 0 16px 22px;
      border-color: transparent transparent transparent #1976d2;
    }
    .arrow-left{
      border-width: 16px 22px 16px 0;
      border-color: transparent #1976d2 transparent transparent;
    }

    /* ガイド内の入力・選択UI */
    .guideInputWrap, .guideSelectWrap{
      display:none;
      margin: 10px 0 0;
      text-align: left;
    }
    .guideInput{
      width: 100%;
      padding: 12px 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 12px;
      box-sizing: border-box;
    }
    .guideSelect{
      width: 100%;
      padding: 12px 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 12px;
      background: #fff;
      box-sizing: border-box;
    }
    .guideHint{
      font-size: 12px;
      color: #555;
      margin-top: 6px;
      white-space: pre-line;
    }
  </style>
<script>
  // iframe内（例：GASの埋め込み表示）だとブラウザの権限ポリシーでカメラがブロックされます。
  // 外部ホスト版は「トップレベル（別タブ）」で開いてください。
  (function(){
    try{
      if (window.top !== window.self) {
        // 可能ならトップへ遷移（ブロックされる環境もある）
        try { window.top.location.href = window.location.href; } catch(e) {}
        // それでもiframe内の場合は、案内を表示
        window.__IN_IFRAME__ = true;
      }
    }catch(e){
      window.__IN_IFRAME__ = true;
    }
  })();
</script>
</head>

  <h1>終了しました</h1>

 
</body>
</html>
