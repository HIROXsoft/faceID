<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>出勤状況一覧</title>
  <style>
    :root{font-size:16px}
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:16px;background:#f5f5f5;color:#222}
    .panel{background:#fff;border-radius:12px;padding:12px 14px;max-width:1200px;margin:0 auto 12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    input,select{padding:10px 12px;border-radius:10px;border:1px solid #ccc;font-size:16px;box-sizing:border-box}
    button{padding:10px 14px;border-radius:10px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:16px}
    .primary{background:#1976d2;border-color:#1976d2;color:#fff}
    .small{font-size:12px;color:#666}
    #status{font-size:13px;margin-top:6px}
    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{border-bottom:1px solid #eee;padding:10px 8px;text-align:left;font-size:14px;vertical-align:top}
    th{background:#fafafa;position:sticky;top:0;z-index:1;white-space:nowrap}
    td.center, th.center{text-align:center}
    .nowrap{white-space:nowrap}
    .muted{color:#999}
    .subtime{font-size:12px;color:#555;line-height:1.4}
    .weekcell{min-width:94px}
  </style>
</head>
<body>
  <div class="panel">
    <h2 style="margin:0 0 6px;">出勤状況一覧</h2>
    <div class="row" style="margin-top:10px">
      <select id="period" style="min-width:180px">
        <option value="today">当日の出勤状況</option>
        <option value="week">今週の出勤状況</option>
      </select>
      <select id="groupFilter" style="min-width:220px">
        <option value="">全グループ</option>
      </select>
      <input id="nameFilter" style="min-width:220px;flex:1" placeholder="氏名で検索"/>
      <button class="primary" onclick="refreshList()">一覧更新</button>
    </div>

    <div id="summary" class="small" style="margin-top:8px"></div>
    <div id="status"></div>
  </div>

  <div class="panel">
    <div style="overflow:auto;max-height:72vh">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"><tr><td class="small">一覧を読み込みます…</td></tr></tbody>
      </table>
    </div>
  </div>

<script>
// =========================================================
// 設定はここだけ変更してください
// 1) GASのデプロイ後に発行された /exec のURL
// 2) GAS側で設定しているAPIキー
// =========================================================
const APP_CONFIG = {
  WEBAPP_URL: 'https://script.google.com/macros/s/AKfycbxpu4nVSBsbIlPfrCZdRxq-P37CSYDxnnRimWnTZAVHYKBDKYriEV-DPq2se39BM5U-5g/exec',
  API_KEY: 'hirox'
};
let latestGroups = [];

function setStatus(m){ document.getElementById('status').textContent = m || ''; }
function setSummary(m){ document.getElementById('summary').textContent = m || ''; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function isGasHost(){
  return typeof google !== 'undefined' && google.script && google.script.run;
}
function loadSettings(){
  // ローカル運用版では APP_CONFIG を直接使います。
}
function saveSettings(){
  setStatus('このローカル運用版では保存操作は不要です。APP_CONFIG を直接変更してください。');
}
function getBase(){
  const url=String(APP_CONFIG.WEBAPP_URL || '').trim();
  const key=String(APP_CONFIG.API_KEY || '').trim();
  if(!url || !key || /REPLACE_WITH_YOUR_/.test(url) || /REPLACE_WITH_YOUR_/.test(key)){
    throw new Error('ファイル先頭の APP_CONFIG の WEBAPP_URL / API_KEY を設定してください');
  }
  return {url, key};
}
function apiJsonpRaw(fn, params={}){
  const base=getBase();
  const u=new URL(base.url);
  u.searchParams.set('api','1');
  u.searchParams.set('fn',fn);
  u.searchParams.set('key',base.key);
  Object.keys(params).forEach(k=>u.searchParams.set(k, params[k]));
  const cb='__cb_'+Math.random().toString(36).slice(2)+Date.now();
  u.searchParams.set('callback', cb);
  return new Promise((resolve,reject)=>{
    const t=setTimeout(()=>{ cleanup(); reject(new Error('timeout')); }, 60000);
    function cleanup(){
      clearTimeout(t);
      try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
      if(script && script.parentNode) script.parentNode.removeChild(script);
    }
    window[cb]=(payload)=>{ cleanup(); resolve(payload); };
    const script=document.createElement('script');
    script.src=u.toString();
    script.async=true;
    script.onerror=()=>{ cleanup(); reject(new Error('script load error')); };
    document.head.appendChild(script);
  });
}
function callApi(fn, params){
  if(isGasHost()){
    return new Promise((resolve,reject)=>{
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err=>reject(new Error(err && err.message ? err.message : String(err))))
        [fn](...(params||[]));
    });
  }
  const map = {
    getAttendanceStatusBoard: 'getAttendanceStatusBoard'
  };
  const apiFn = map[fn];
  if(!apiFn) return Promise.reject(new Error('unknown api function'));
  const p = {
    period: params[0] || 'today',
    group: params[1] || '',
    name: params[2] || ''
  };
  return apiJsonpRaw(apiFn, p).then(payload=>{
    if(!payload || payload.ok !== true) throw new Error((payload && payload.error) ? payload.error : 'api error');
    return payload.data;
  });
}
function populateGroups(groups){
  latestGroups = Array.isArray(groups) ? groups.slice() : [];
  const sel = document.getElementById('groupFilter');
  const current = sel.value;
  sel.innerHTML = '<option value="">全グループ</option>';
  latestGroups.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g;
    opt.textContent = g;
    sel.appendChild(opt);
  });
  if ([...sel.options].some(o => o.value === current)) sel.value = current;
}
function renderToday(data){
  const thead = document.getElementById('thead');
  const tbody = document.getElementById('tbody');
  const rows = Array.isArray(data.rows) ? data.rows : [];
  thead.innerHTML = '<tr>'+
    '<th style="min-width:160px">グループ</th>'+
    '<th style="min-width:160px">氏名</th>'+
    '<th class="center" style="min-width:120px">出勤時刻</th>'+
    '<th class="center" style="min-width:120px">退勤時刻</th>'+
    '</tr>';
  tbody.innerHTML='';
  if(!rows.length){
    tbody.innerHTML='<tr><td colspan="4" class="small">該当データはありません。</td></tr>';
    return;
  }
  rows.forEach(r=>{
    const tr=document.createElement('tr');
    tr.innerHTML =
      '<td>'+esc(r.group||'')+'</td>'+
      '<td>'+esc(r.name||'')+'</td>'+
      '<td class="center nowrap">'+(r.start ? esc(r.start) : '<span class="muted">-</span>')+'</td>'+
      '<td class="center nowrap">'+(r.end ? esc(r.end) : '<span class="muted">-</span>')+'</td>';
    tbody.appendChild(tr);
  });
}
function renderWeek(data){
  const thead = document.getElementById('thead');
  const tbody = document.getElementById('tbody');
  const cols = Array.isArray(data.columns) ? data.columns : [];
  const rows = Array.isArray(data.rows) ? data.rows : [];
  let h = '<tr><th style="min-width:160px">グループ</th><th style="min-width:160px">氏名</th>';
  cols.forEach(c => { h += '<th class="center weekcell">'+esc(c.label||'')+'</th>'; });
  h += '</tr>';
  thead.innerHTML = h;
  tbody.innerHTML = '';
  if(!rows.length){
    tbody.innerHTML='<tr><td colspan="'+String(cols.length + 2)+'" class="small">該当データはありません。</td></tr>';
    return;
  }
  rows.forEach(r => {
    const tr=document.createElement('tr');
    let html = '<td>'+esc(r.group||'')+'</td><td>'+esc(r.name||'')+'</td>';
    (r.days||[]).forEach(d => {
      const body = (d.start || d.end)
        ? '<div class="subtime">出: '+esc(d.start||'-')+'<br>退: '+esc(d.end||'-')+'</div>'
        : '<span class="muted">-</span>';
      html += '<td class="center weekcell">'+body+'</td>';
    });
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });
}
async function refreshList(){
  const period = (document.getElementById('period').value || 'today').trim();
  const group = (document.getElementById('groupFilter').value || '').trim();
  const name = (document.getElementById('nameFilter').value || '').trim();
  try{
    setStatus('読み込み中...（人数が多い場合は少し時間がかかります）');
    const data = await callApi('getAttendanceStatusBoard', [period, group, name]);
    populateGroups(data.groups || []);
    if (data.period === 'week') {
      renderWeek(data);
      setSummary((data.title || '今週の出勤状況') + ' / ' + (data.weekLabel || '') + ' / ' + ((data.rows||[]).length) + '件');
    } else {
      renderToday(data);
      setSummary((data.title || '当日の出勤状況') + ' / ' + (data.dateLabel || '') + ' / ' + ((data.rows||[]).length) + '件');
    }
    setStatus('読み込み完了');
  }catch(e){
    document.getElementById('thead').innerHTML='';
    document.getElementById('tbody').innerHTML = '<tr><td class="small">一覧取得NG: '+esc(e.message)+'</td></tr>';
    setSummary('');
    setStatus('一覧取得NG: ' + e.message);
  }
}
window.addEventListener('load', ()=>{
  loadSettings();
  setStatus('ローカル/社内サーバー版で動作中');
  document.getElementById('period').addEventListener('change', refreshList);
  document.getElementById('groupFilter').addEventListener('change', refreshList);
  document.getElementById('nameFilter').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') refreshList(); });
  refreshList();
});
</script>
</body>
</html>
